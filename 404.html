<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevent</title>
<meta name="description" content="Eventos anime, gaming, cosplay y J-culture en Chile.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #1a0030 0%, #08001A 55%, #05000f 100%);
    color: #E8E8FF; font-family: -apple-system, Roboto, 'Segoe UI', sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 380px; }
  .logo {
    width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #BF00FF, #00F5FF);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: #08001A;
  }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: 0.5px; }
  p { color: #9090C0; line-height: 1.5; margin: 0 0 28px; font-size: 15px; }
  a.btn {
    display: inline-block; width: 100%; padding: 14px; border-radius: 12px;
    background: linear-gradient(90deg, #BF00FF, #00F5FF);
    color: #08001A; font-weight: 700; text-decoration: none; font-size: 15px;
    letter-spacing: 0.5px;
  }
  .hint { margin-top: 16px; font-size: 12px; color: #5A5A78; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">E</div>
    <h1>Elevent</h1>
    <p>Este enlace es para abrir Elevent en tu teléfono. Si no tienes la app instalada, descárgala para ver el evento.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=cl.panoram.app">Descargar en Google Play</a>
    <div class="hint">Anime · Gaming · Cosplay · J-Culture</div>
  </div>
  <script>
    // Si el link vino con una ruta (ej. /event/xxx), intenta abrir la app
    // vía el esquema personalizado antes de mostrar solo el botón de Play
    // Store — cubre el caso de un dispositivo donde el App Link https
    // todavía no verificó (puede tardar un rato tras instalar).
    var path = window.location.pathname;
    if (path && path !== '/' && path !== '/index.html') {
      window.location.href = 'elevent://' + path.replace(/^\//, '');
    }
  </script>
</body>
</html>
